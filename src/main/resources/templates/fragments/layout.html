<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header-css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/notion.css}">
</head>
<body>

<!-- Left Notion Sidebar -->
<aside th:fragment="sidebar" class="notion-sidebar" id="notionSidebar">
    <div class="notion-sidebar-header">
        <a href="/" class="notion-workspace-brand">
            <span class="notion-workspace-icon"><i class="bi bi-mortarboard"></i></span>
            <span>Placement Portal</span>
        </a>
    </div>

    <div class="notion-sidebar-nav">
        <!-- Student Links -->
        <div sec:authorize="hasRole('STUDENT')">
            <div class="notion-nav-section-title">Student Workspace</div>
            <a class="notion-nav-item" th:href="@{/student/dashboard}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/student/dashboard'} ? 'active'">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a class="notion-nav-item" th:href="@{/student/jobs}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI.startsWith('/student/jobs')} ? 'active'">
                <i class="bi bi-briefcase"></i>
                <span>Eligible Jobs</span>
            </a>
            <a class="notion-nav-item" th:href="@{/student/applications}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/student/applications'} ? 'active'">
                <i class="bi bi-journal-text"></i>
                <span>My Applications</span>
            </a>
            <a class="notion-nav-item" th:href="@{/student/interviews}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/student/interviews'} ? 'active'">
                <i class="bi bi-calendar-check"></i>
                <span>My Interviews</span>
            </a>
            <a class="notion-nav-item" th:href="@{/student/profile}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/student/profile'} ? 'active'">
                <i class="bi bi-person"></i>
                <span>Profile &amp; Resume</span>
            </a>
        </div>

        <!-- Company Links -->
        <div sec:authorize="hasRole('COMPANY')">
            <div class="notion-nav-section-title">Recruiter Workspace</div>
            <a class="notion-nav-item" th:href="@{/company/dashboard}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/company/dashboard'} ? 'active'">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a class="notion-nav-item" th:href="@{/company/jobs}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/company/jobs'} ? 'active'">
                <i class="bi bi-briefcase"></i>
                <span>My Jobs</span>
            </a>
            <a class="notion-nav-item" th:href="@{/company/jobs/new}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/company/jobs/new'} ? 'active'">
                <i class="bi bi-plus-lg"></i>
                <span>Post New Job</span>
            </a>
        </div>

        <!-- Admin / Placement Cell Links -->
        <div sec:authorize="hasRole('PLACEMENT_CELL')">
            <div class="notion-nav-section-title">Placement Cell</div>
            <a class="notion-nav-item" th:href="@{/admin/dashboard}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/admin/dashboard'} ? 'active'">
                <i class="bi bi-bar-chart"></i>
                <span>Analytics</span>
            </a>
            <a class="notion-nav-item" th:href="@{/admin/jobs/pending}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/admin/jobs/pending'} ? 'active'">
                <i class="bi bi-clock-history"></i>
                <span>Pending Jobs</span>
            </a>
            <a class="notion-nav-item" th:href="@{/admin/jobs}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/admin/jobs'} ? 'active'">
                <i class="bi bi-briefcase"></i>
                <span>All Jobs</span>
            </a>
            <a class="notion-nav-item" th:href="@{/admin/companies}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI.startsWith('/admin/companies')} ? 'active'">
                <i class="bi bi-building"></i>
                <span>Companies</span>
            </a>
            <a class="notion-nav-item" th:href="@{/admin/students}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/admin/students'} ? 'active'">
                <i class="bi bi-people"></i>
                <span>Students</span>
            </a>
            <a class="notion-nav-item" th:href="@{/admin/applications}" th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/admin/applications'} ? 'active'">
                <i class="bi bi-file-earmark-text"></i>
                <span>Applications</span>
            </a>
        </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="notion-sidebar-footer" sec:authorize="isAuthenticated()">
        <div class="notion-user-chip">
            <div style="display: flex; align-items: center; gap: 8px; overflow: hidden;">
                <div class="notion-user-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px;">
                    <div style="font-weight: 500; color: var(--text-primary);" sec:authentication="name">user@college.edu</div>
                    <div style="font-size: 11px; color: var(--text-tertiary);" sec:authentication="principal.authorities[0].authority">ROLE</div>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="notion-btn notion-btn-ghost notion-btn-sm" title="Log out" style="padding: 4px;">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
</aside>

<!-- Topbar with mobile toggle -->
<header th:fragment="topbar" class="notion-topbar">
    <div style="display: flex; align-items: center; gap: 12px;">
        <button type="button" class="notion-btn notion-btn-ghost notion-btn-sm" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Toggle Navigation">
            <i class="bi bi-list" style="font-size: 18px;"></i>
        </button>
        <div class="notion-breadcrumb">
            <span class="sep">/</span>
            <span class="current" th:text="${pageTitle} ?: 'Workspace'">Dashboard</span>
        </div>
    </div>
</header>

<!-- Alert Banners in Notion Callout Style -->
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="notion-callout success">
        <div class="notion-callout-icon"><i class="bi bi-check2"></i></div>
        <div class="notion-callout-text" th:text="${successMessage}">Success message</div>
    </div>
    <div th:if="${errorMessage}" class="notion-callout error">
        <div class="notion-callout-icon"><i class="bi bi-exclamation-circle"></i></div>
        <div class="notion-callout-text" th:text="${errorMessage}">Error message</div>
    </div>
</div>

<!-- Footer Scripts -->
<div th:fragment="scripts">
    <div class="notion-sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('notionSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('open');
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const sidebar = document.getElementById('notionSidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    if (overlay) overlay.classList.remove('open');
                }
            }
        });
    </script>
</div>

</body>
</html>
