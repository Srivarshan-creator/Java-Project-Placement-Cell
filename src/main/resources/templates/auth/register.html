<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Registration - Placement Portal</title>
    <th:block th:replace="~{fragments/layout :: header-css}"></th:block>
</head>
<body style="background-color: var(--bg-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 24px;">

<div style="max-width: 520px; width: 100%;">
    <div style="margin-bottom: 28px;">
        <a th:href="@{/login}" class="notion-btn notion-btn-ghost notion-btn-sm" style="margin-bottom: 16px; padding-left: 0;">
            <i class="bi bi-arrow-left"></i> Back to sign in
        </a>
        <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">Create your student profile</h1>
        <p style="font-size: 14px; color: var(--text-secondary); margin: 0;">Register to access verified campus recruitment opportunities</p>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <form th:action="@{/register}" th:object="${studentDto}" method="post">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="notion-form-group">
                <label for="name" class="notion-label">Full Name</label>
                <input type="text" class="notion-input" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name" th:field="*{name}" placeholder="Rahul Verma">
                <div class="notion-error" th:errors="*{name}"></div>
            </div>

            <div class="notion-form-group">
                <label for="email" class="notion-label">College Email</label>
                <input type="email" class="notion-input" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" id="email" th:field="*{email}" placeholder="rahul@college.edu">
                <div class="notion-error" th:errors="*{email}"></div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="notion-form-group">
                <label for="password" class="notion-label">Password</label>
                <input type="password" class="notion-input" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="password" th:field="*{password}" placeholder="Min 6 characters">
                <div class="notion-error" th:errors="*{password}"></div>
            </div>

            <div class="notion-form-group">
                <label for="branch" class="notion-label">Department</label>
                <select class="notion-select" th:classappend="${#fields.hasErrors('branch')} ? 'is-invalid'" id="branch" th:field="*{branch}">
                    <option value="">Select branch</option>
                    <option th:each="b : ${branches}" th:value="${b}" th:text="${b}"></option>
                </select>
                <div class="notion-error" th:errors="*{branch}"></div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="notion-form-group">
                <label for="cgpa" class="notion-label">CGPA (0.0 - 10.0)</label>
                <input type="number" step="0.01" min="0" max="10" class="notion-input" th:classappend="${#fields.hasErrors('cgpa')} ? 'is-invalid'" id="cgpa" th:field="*{cgpa}" placeholder="8.50">
                <div class="notion-error" th:errors="*{cgpa}"></div>
            </div>

            <div class="notion-form-group">
                <label for="backlogs" class="notion-label">Active Backlogs</label>
                <input type="number" min="0" class="notion-input" th:classappend="${#fields.hasErrors('backlogs')} ? 'is-invalid'" id="backlogs" th:field="*{backlogs}" placeholder="0">
                <div class="notion-error" th:errors="*{backlogs}"></div>
            </div>
        </div>

        <div class="notion-form-group">
            <label for="skills" class="notion-label">Technical Skills (comma-separated)</label>
            <input type="text" class="notion-input" th:classappend="${#fields.hasErrors('skills')} ? 'is-invalid'" id="skills" th:field="*{skills}" placeholder="Java, Spring Boot, SQL, React">
            <div class="notion-hint">Separate individual skills with commas.</div>
            <div class="notion-error" th:errors="*{skills}"></div>
        </div>

        <div style="margin-top: 24px;">
            <button type="submit" class="notion-btn notion-btn-primary" style="width: 100%; padding: 8px;">
                Complete registration
            </button>
        </div>
    </form>

    <div class="notion-divider"></div>

    <div style="text-align: center; font-size: 13px; color: var(--text-secondary);">
        Already have an account?
        <a th:href="@{/login}" style="color: var(--accent-blue); font-weight: 500; margin-left: 4px;">Sign in</a>
    </div>
</div>

</body>
</html>
