<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Company - Placement Portal</title>
    <th:block th:replace="~{fragments/layout :: header-css}"></th:block>
</head>
<body style="background-color: var(--bg-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">

<div style="max-width: 420px; width: 100%;">
    <div style="text-align: center; margin-bottom: 28px;">
        <div style="width: 44px; height: 44px; margin: 0 auto 12px; border-radius: var(--radius-md); background-color: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--text-primary);">
            <i class="bi bi-briefcase"></i>
        </div>
        <h1 style="font-size: 20px; font-weight: 600; margin-bottom: 6px;">Register Company</h1>
        <p style="font-size: 13.5px; color: var(--text-secondary); margin: 0;">Create an account to post jobs and recruit campus talent</p>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <form th:action="@{/register/company}" th:object="${companyDto}" method="post">
        <div class="notion-form-group">
            <label for="name" class="notion-label">Company Name *</label>
            <input type="text" class="notion-input" id="name" th:field="*{name}"
                   placeholder="e.g. Acme Corporation" required autofocus>
            <span class="notion-field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="notion-form-group">
            <label for="contactEmail" class="notion-label">Official Work Email *</label>
            <input type="email" class="notion-input" id="contactEmail" th:field="*{contactEmail}"
                   placeholder="recruiter@company.com" required>
            <span class="notion-field-error" th:if="${#fields.hasErrors('contactEmail')}" th:errors="*{contactEmail}"></span>
        </div>

        <div class="notion-form-group">
            <label for="password" class="notion-label">Password *</label>
            <input type="password" class="notion-input" id="password" th:field="*{password}"
                   placeholder="At least 6 characters" required>
            <span class="notion-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div style="margin-top: 24px;">
            <button type="submit" class="notion-btn notion-btn-primary" style="width: 100%; padding: 8px;">
                Create Company Account
            </button>
        </div>
    </form>

    <div class="notion-divider"></div>

    <div style="text-align: center; font-size: 13px; color: var(--text-secondary);">
        Already have an account?
        <a th:href="@{/login}" style="color: var(--accent-blue); font-weight: 500; margin-left: 4px;">Sign in</a>
    </div>
</div>

</body>
</html>
