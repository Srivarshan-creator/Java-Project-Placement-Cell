<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign In - Placement Portal</title>
    <th:block th:replace="~{fragments/layout :: header-css}"></th:block>
</head>
<body style="background-color: var(--bg-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">

<div style="max-width: 380px; width: 100%;">

    <!-- Logo -->
    <div style="text-align: center; margin-bottom: 32px;">
        <div style="width: 44px; height: 44px; margin: 0 auto 12px; border-radius: var(--radius-md); background-color: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--text-primary);">
            <i class="bi bi-mortarboard"></i>
        </div>
        <h1 style="font-size: 20px; font-weight: 600; margin-bottom: 6px;">Placement Portal</h1>
        <p style="font-size: 13.5px; color: var(--text-secondary); margin: 0;">Who are you signing in as?</p>
    </div>

    <!-- Step 1: Role Picker -->
    <div id="step-role">
        <div style="display: flex; flex-direction: column; gap: 8px;">

            <button type="button" onclick="selectRole('student', 'Student', 'bi-person-circle')"
                    class="role-card">
                <span style="font-size: 20px; color: var(--text-secondary); flex-shrink: 0;">
                    <i class="bi bi-person-circle"></i>
                </span>
                <div style="text-align: left;">
                    <div style="font-size: 14px; font-weight: 500; color: var(--text-primary);">Student</div>
                    <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 2px;">View jobs, apply, track your applications</div>
                </div>
                <span style="margin-left: auto; color: var(--text-tertiary); font-size: 14px;">
                    <i class="bi bi-chevron-right"></i>
                </span>
            </button>

            <button type="button" onclick="selectRole('placement', 'Placement Cell', 'bi-building-gear')"
                    class="role-card">
                <span style="font-size: 20px; color: var(--text-secondary); flex-shrink: 0;">
                    <i class="bi bi-building-gear"></i>
                </span>
                <div style="text-align: left;">
                    <div style="font-size: 14px; font-weight: 500; color: var(--text-primary);">Placement Cell</div>
                    <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 2px;">Manage approvals, companies, and analytics</div>
                </div>
                <span style="margin-left: auto; color: var(--text-tertiary); font-size: 14px;">
                    <i class="bi bi-chevron-right"></i>
                </span>
            </button>

            <button type="button" onclick="selectRole('company', 'Company', 'bi-briefcase')"
                    class="role-card">
                <span style="font-size: 20px; color: var(--text-secondary); flex-shrink: 0;">
                    <i class="bi bi-briefcase"></i>
                </span>
                <div style="text-align: left;">
                    <div style="font-size: 14px; font-weight: 500; color: var(--text-primary);">Company</div>
                    <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 2px;">Post jobs and manage applicants</div>
                </div>
                <span style="margin-left: auto; color: var(--text-tertiary); font-size: 14px;">
                    <i class="bi bi-chevron-right"></i>
                </span>
            </button>

        </div>
    </div>

    <!-- Step 2: Login Form (hidden until role selected) -->
    <div id="step-form" style="display: none;">

        <!-- Back + role badge -->
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
            <button type="button" onclick="goBack()"
                    style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-secondary); background: none; border: none; cursor: pointer; padding: 4px 0; transition: color 150ms;"
                    onmouseenter="this.style.color='var(--text-primary)'"
                    onmouseleave="this.style.color='var(--text-secondary)'">
                <i class="bi bi-arrow-left"></i> Back
            </button>
            <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text-secondary); background: var(--bg-hover); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border-primary);">
                <i id="role-icon" class="bi"></i>
                <span id="role-label"></span>
            </span>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/login}" method="post">
            <div class="notion-form-group">
                <label for="username" class="notion-label">Email</label>
                <input type="email" class="notion-input" id="username" name="username"
                       placeholder="name@example.com" required autofocus>
            </div>

            <div class="notion-form-group">
                <label for="password" class="notion-label">Password</label>
                <input type="password" class="notion-input" id="password" name="password"
                       placeholder="••••••••" required>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="notion-btn notion-btn-primary" style="width: 100%; padding: 8px;">
                    Continue
                </button>
            </div>
        </form>

        <!-- Student bottom registration link -->
        <div id="bottom-student-register" style="display: none;">
            <div class="notion-divider"></div>
            <div style="text-align: center; font-size: 13px; color: var(--text-secondary);">
                New student?
                <a th:href="@{/register}" style="color: var(--accent-blue); font-weight: 500; margin-left: 4px;">Create an account</a>
            </div>
        </div>

        <!-- Company bottom registration link -->
        <div id="bottom-company-register" style="display: none;">
            <div class="notion-divider"></div>
            <div style="text-align: center; font-size: 13px; color: var(--text-secondary);">
                New recruiting partner?
                <a th:href="@{/register/company}" style="color: var(--accent-blue); font-weight: 500; margin-left: 4px;">Register company</a>
            </div>
        </div>

        <!-- Placement Cell has NO registration option -->
    </div>

</div>

<style>
.role-card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    cursor: pointer;
    transition: background 150ms ease-out, border-color 150ms ease-out;
    text-align: left;
}
.role-card:hover {
    background: var(--bg-hover);
    border-color: var(--border-secondary);
}
.role-card:active {
    background: var(--bg-active);
}
</style>

<script>
function selectRole(role, label, icon) {
    document.getElementById('role-label').textContent = label;
    document.getElementById('role-icon').className = 'bi ' + icon;
    
    // Hide both registration links by default
    document.getElementById('bottom-student-register').style.display = 'none';
    document.getElementById('bottom-company-register').style.display = 'none';

    // Show appropriate registration link strictly for Student or Company
    if (role === 'student') {
        document.getElementById('bottom-student-register').style.display = 'block';
        document.getElementById('username').placeholder = 'student@college.edu';
    } else if (role === 'company') {
        document.getElementById('bottom-company-register').style.display = 'block';
        document.getElementById('username').placeholder = 'recruiter@company.com';
    } else {
        document.getElementById('username').placeholder = 'admin@college.edu';
    }

    document.getElementById('step-role').style.display = 'none';
    document.getElementById('step-form').style.display = 'block';
    document.getElementById('username').focus();
}

function goBack() {
    document.getElementById('step-form').style.display = 'none';
    document.getElementById('step-role').style.display = 'block';
}
</script>

</body>
</html>
