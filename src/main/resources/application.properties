spring.application.name=college-placement-system

# Server
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/placement_db}
spring.data.mongodb.auto-index-creation=true

# Mail Configuration (Mailpit defaults: localhost:1025)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=23dx45@psgpolytech.ac.in
spring.mail.password=juhl adya zdaa qnzi
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Limits (Max 2MB for PDF resume)
